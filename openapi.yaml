openapi: 3.0.3
servers:
  - url: https://api.example.com/v1
paths:
  /users/{id}:
    get:
      tags:
        - Users
      parameters:
        - name: id
          in: path
          required: true
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        500:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
          format: email
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - username
        - email
    Error:
      type: object
      properties:
        message:
          type: string
          example: "User not found"
        code:
          type: integer
          example: 404
      required:
        - message
        - code
